services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: panahan_app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    networks:
      - panahan

  nginx:
    image: nginx:alpine
    container_name: panahan_nginx
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - panahan

  postgres:
    image: postgres:17
    container_name: panahan_postgres
    environment:
      POSTGRES_DB: panahan_deswita
      POSTGRES_USER: panahan
      POSTGRES_PASSWORD: panahan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panahan -d panahan"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - panahan

networks:
  panahan:

volumes:
  postgres_data:
